name: Generate profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Test the card generator
        run: node --test scripts/test/*.test.mjs

      # Created by the runner user: the snake container runs as root, and a
      # dist/ it created would be read-only for the card generator.
      - name: Prepare the output folder
        run: mkdir -p dist

      # Colors match SNAKE in scripts/crt/kit.mjs (checked by workflow.test.mjs).
      - name: Generate the snake from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/snake-raw.svg?color_snake=#8cffa8&color_dots=#0a1f12,#0e4429,#006d32,#26a641,#39d353

      - name: Draw the CRT banner and cards
        run: node scripts/generate-cards.mjs
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Check every SVG is well-formed
        run: python3 -c "import glob,sys,xml.etree.ElementTree as E; fs=glob.glob('dist/*.svg'); [E.parse(f) for f in fs]; print(len(fs),'SVGs ok')"

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          author: briandevbr <briandevbr@gmail.com>
          committer: briandevbr <briandevbr@gmail.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Authored as the profile owner so the bot never shows up as a contributor.
      - name: Commit README if the live-projects block changed
        run: |
          git config user.name "briandevbr"
          git config user.email "briandevbr@gmail.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore(readme): atualiza as seções geradas" && git push)
