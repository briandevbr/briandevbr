name: Generate profile assets

on:
  schedule:
    - cron: "0 */12 * * *"
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - name: Generate language and contribution graph cards
        run: node scripts/generate-cards.mjs
        env:
          GITHUB_USER: ${{ github.repository_owner }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Generate snake SVGs from the contribution graph
        uses: Platane/snk@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-snake.svg
            dist/github-snake-dark.svg?palette=github-dark

      - name: Push SVGs to the output branch
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
          author: briandevbr <briandevbr@gmail.com>
          committer: briandevbr <briandevbr@gmail.com>
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Authored as the profile owner so the bot never shows up as a contributor.
      - name: Commit README if a generated section changed
        run: |
          git config user.name "briandevbr"
          git config user.email "briandevbr@gmail.com"
          git add README.md
          git diff --cached --quiet || (git commit -m "chore(readme): atualiza as seções geradas" && git push)
